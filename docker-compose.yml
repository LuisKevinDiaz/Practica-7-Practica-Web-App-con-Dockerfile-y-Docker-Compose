services:
  web:
    image: python:3.9-slim
    container_name: servidor-python
    volumes:
      - ./src:/app
    working_dir: /app
    # Instala las dependencias y luego corre la aplicación
    command: sh -c "pip install -r requirements.txt && python app.py"
    ports:
      - "5000:5000"
    environment:
      - DB_HOST=db
      - DB_USER=kevin
      - DB_PASSWORD=secreto
      - DB_NAME=holamundo_db
    depends_on:
      - db

  db:
    image: mysql:8.0
    container_name: servidor-mysql
    environment:
      - MYSQL_ROOT_PASSWORD=root
      - MYSQL_DATABASE=holamundo_db
      - MYSQL_USER=kevin
      - MYSQL_PASSWORD=secreto
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql

volumes:
  mysql_data: